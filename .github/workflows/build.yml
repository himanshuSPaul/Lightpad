name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm audit --omit=dev && npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo install --locked cargo-audit && cargo audit --file src-tauri/Cargo.lock

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # To sign Windows builds, add your certificate settings to tauri.conf.json
      # (bundle.windows) and the matching secrets here. See https://tauri.app/distribute/sign/windows/
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: lightpad-${{ matrix.os }}
          path: src-tauri/target/release/bundle/

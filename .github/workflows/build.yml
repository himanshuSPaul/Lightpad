name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm audit --omit=dev && npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo install --locked cargo-audit && cargo audit --file src-tauri/Cargo.lock

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # To sign Windows builds, add your certificate settings to tauri.conf.json
      # (bundle.windows) and the matching secrets here. See https://tauri.app/distribute/sign/windows/
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: lightpad-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
      # Pushing a tag such as v0.1.0 publishes a GitHub Release with the installers,
      # which is the download page to give customers.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path src-tauri/target/release/lightpad.exe -DestinationPath Lightpad-portable-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            Lightpad-portable-windows-x64.zip

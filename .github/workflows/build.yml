name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag, e.g. v0.1.0 (leave empty to only build)"
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm audit --omit=dev && npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo install --locked cargo-audit && cargo audit --file src-tauri/Cargo.lock

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # To sign Windows builds, add your certificate settings to tauri.conf.json
      # (bundle.windows) and the matching secrets here. See https://tauri.app/distribute/sign/windows/
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: lightpad-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
      # Pushing a tag such as v0.1.0 publishes a GitHub Release with the installers,
      # which is the download page to give customers.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path src-tauri/target/release/lightpad.exe -DestinationPath Lightpad-portable-windows-x64.zip
      # The release notes are this version's section of CHANGELOG.md.
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: awk -v h="## $TAG " 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > release-notes.md
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Lightpad ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            Lightpad-portable-windows-x64.zip

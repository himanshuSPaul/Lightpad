[package]
name = "lightpad"
version = "0.1.0"
description = "A lightweight text editor with a built-in terminal"
edition = "2021"

[lib]
name = "lightpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

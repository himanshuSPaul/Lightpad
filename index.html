<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightpad</title>
  </head>
  <body>
    <header id="toolbar">
      <button data-cmd="explorer" id="explorer-btn" title="Toggle explorer (Ctrl+B)">Explorer</button>
      <span class="sep"></span>
      <button data-cmd="new" title="New (Ctrl+N)">New</button>
      <button data-cmd="open" title="Open file (Ctrl+O)">Open</button>
      <button data-cmd="openFolder" title="Open folder (Ctrl+Shift+O)">Open Folder</button>
      <div class="dropdown">
        <button id="recent-btn" title="Recent files">Recent ▾</button>
        <ul id="recent-list" hidden></ul>
      </div>
      <button data-cmd="save" title="Save (Ctrl+S)">Save</button>
      <button data-cmd="saveAs" title="Save As (Ctrl+Shift+S)">Save As</button>
      <span class="sep"></span>
      <button data-cmd="find" title="Find / Replace (Ctrl+F)">Find</button>
      <button data-cmd="wrap" id="wrap-btn" title="Toggle word wrap (Alt+Z)">Wrap</button>
      <button data-cmd="language" title="Syntax highlighting language (Ctrl+Shift+L)">Language ▾</button>
      <button data-cmd="theme" title="Toggle light/dark theme">Theme</button>
      <span class="spacer"></span>
      <button data-cmd="terminal" id="term-btn" title="Toggle terminal (Ctrl+`)">Terminal</button>
    </header>

    <div id="body-row">
    <aside id="sidebar">
      <div id="sidebar-head">
        <span>Explorer</span>
        <span class="spacer"></span>
        <button data-cmd="refreshTree" title="Refresh">⟳</button>
        <button data-cmd="collapseTree" title="Collapse all">⊟</button>
      </div>
      <div id="explorer-title"></div>
      <div id="tree"></div>
    </aside>
    <div id="side-resizer"></div>
    <main id="workspace">
      <nav id="tabs"></nav>
      <section id="editor"></section>
      <div id="resizer" hidden></div>
      <section id="terminal-panel" hidden>
        <div id="term-tabs">
          <span id="term-tab-list"></span>
          <button id="term-new" title="New terminal">+</button>
          <span class="spacer"></span>
          <button id="term-close-panel" title="Hide terminal">×</button>
        </div>
        <div id="term-hosts"></div>
      </section>
    </main>
    </div>

    <div id="lang-picker" hidden>
      <input id="lang-filter" placeholder="Select language (type to filter, e.g. python or .sql)" spellcheck="false" />
      <ul id="lang-list"></ul>
    </div>

    <footer id="status">
      <span id="st-path"></span>
      <span class="spacer"></span>
      <span id="st-pos"></span>
      <span id="st-lang" title="Change language (Ctrl+Shift+L)"></span>
      <span id="st-eol"></span>
      <span id="st-enc"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
